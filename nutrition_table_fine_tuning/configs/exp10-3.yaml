experiment: exp10_2 # 10 combo flash+formatted mode, without collator

model_id: "Qwen/Qwen2-VL-7B-Instruct"

min_pixels: 50176
max_pixels: 705600
max_seq_length: 1024
warmup_ratio: 0.03

eval_strategy: "steps"
eval_steps: 200
save_strategy: "steps"
save_steps: 200
logging_steps: 10

load_best_model_at_end: true

# global toggles
use_flash: true          # ⚡ enable FlashAttention v2
format_data: true        # ✅ use format_consistent() messages
collator:
  enabled: false         # choose collator or not
  numeric_only: false    # if collator enabled, limit to numeric tokens

stages:
  # Stage 1: vision warmup (last 8 blocks only, const LR)
  - name: exp10-2_vision_warmup
    batch_size: 4
    grad_accum_steps: 4
    lr: 0.00005
    epochs: 3
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.1
    lr_scheduler_type: "constant"
    regex_targets:
      - "visual\\.blocks\\.(2[3-9]|30)\\.attn\\.(qkv|proj)"

  # Stage 2: full vision encoder (const LR)
  - name: exp10-2_vision_full
    batch_size: 2
    grad_accum_steps: 8
    lr: 0.0001
    epochs: 6
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    lr_scheduler_type: "constant"
    regex_targets:
      - "visual\\.blocks\\.\\d+\\.attn\\.(qkv|proj)"
      - "visual\\.blocks\\.\\d+\\.mlp\\.(fc1|fc2)"
      - "visual\\.merger\\.mlp\\.[02]"

  # Stage 3: joint training (linear LR decay)
  - name: exp10-2_joint_training
    batch_size: 1
    grad_accum_steps: 16
    lr: 0.00001
    epochs: 12
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    lr_scheduler_type: "linear"
    regex_targets:
      - "visual\\.blocks\\.\\d+\\.attn\\.(qkv|proj)"
      - "visual\\.blocks\\.\\d+\\.mlp\\.(fc1|fc2)"
      - "visual\\.merger\\.mlp\\.[02]"
      - "self_attn\\.(q_proj|k_proj|v_proj|o_proj)"
      - "mlp\\.(gate_proj|up_proj|down_proj)"
