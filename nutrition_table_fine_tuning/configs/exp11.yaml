experiment: exp10 # exp10 larger pixel, sequence length

model_id: "Qwen/Qwen2-VL-7B-Instruct"

min_pixels: 65536
max_pixels: 1572864
max_seq_length: 2048
warmup_ratio: 0.03

eval_strategy: "steps"
eval_steps: 50
save_strategy: "steps"
save_steps: 50
logging_steps: 10

load_best_model_at_end: true

stages:
  # Stage 1: vision warmup (last 8 blocks only, const LR)
  - name: exp10_vision_warmup
    batch_size: 8
    grad_accum_steps: 4
    lr: 0.00005
    epochs: 3
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.1
    lr_scheduler_type: "constant"
    regex_targets:
      - "visual\\.blocks\\.(2[3-9]|30)\\.attn\\.(qkv|proj)"

  # Stage 2: full vision encoder (const LR)
  - name: exp10_vision_full
    batch_size: 2
    grad_accum_steps: 8
    lr: 0.0001
    epochs: 6
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    lr_scheduler_type: "constant"
    regex_targets:
      - "visual\\.blocks\\.\\d+\\.attn\\.(qkv|proj)"
      - "visual\\.blocks\\.\\d+\\.mlp\\.(fc1|fc2)"
      - "visual\\.merger\\.mlp\\.[02]"

  # Stage 3: joint training (linear LR decay)
  - name: exp10_joint_training
    batch_size: 1
    grad_accum_steps: 16
    lr: 0.00001
    epochs: 12
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    lr_scheduler_type: "linear"
    regex_targets:
      - "visual\\.blocks\\.\\d+\\.attn\\.(qkv|proj)"
      - "visual\\.blocks\\.\\d+\\.mlp\\.(fc1|fc2)"
      - "visual\\.merger\\.mlp\\.[02]"
      - "self_attn\\.(q_proj|k_proj|v_proj|o_proj)"
      - "mlp\\.(gate_proj|up_proj|down_proj)"
