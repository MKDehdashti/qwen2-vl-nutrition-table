experiment: exp10_merge_test_repro

model_id: "Qwen/Qwen2-VL-7B-Instruct"

min_pixels: 784
max_pixels: 705600
max_seq_length: 512
warmup_steps: 100

# min_pixels: 50176
# max_pixels: 705600
# max_seq_length: 1024
# warmup_ratio: 0.03

eval_strategy: "steps"
eval_steps: 80
save_strategy: "steps"
save_steps: 80
logging_steps: 80
load_best_model_at_end: true

use_flash: true
format_data: true
collator:
  enabled: true
  numeric_only: false

# debug:
#   train_subset: 100
#   val_subset: 20
#   wandb_suffix: "-merge_repro"
#   wandb_tags: ["merge", "repro"]

# debug:
#   dataset_subset: 20
#   wandb_suffix: "-mergecheck"
#   wandb_tags: ["mergecheck"]

# debug_eval: true
# debug_eval_limit: 5

# continue_from_merged: true

stages:
  # Stage 1 – vision warmup (last 8 blocks only)
  - name: exp10_visio_warmup_merge_test_repro_15
    batch_size: 4
    grad_accum_steps: 4
    lr: 0.00005
    epochs: 3
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.1
    lr_scheduler_type: "constant"
    regex_targets:
      - "visual\\.blocks\\.(2[3-9]|30)\\.attn\\.(qkv|proj)"

  # Stage 2 – full vision encoder
  - name: exp10_full_visio_merge_test_repro_15
    batch_size: 2
    grad_accum_steps: 8
    lr: 0.0001
    epochs: 6
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    lr_scheduler_type: "constant"
    regex_targets:
      - "visual\\.blocks\\.\\d+\\.attn\\.(qkv|proj)"
      - "visual\\.blocks\\.\\d+\\.mlp\\.(fc1|fc2)"
      - "visual\\.merger\\.mlp\\.[02]"

  # Stage 3 – joint training (vision + language)
  - name: exp10_joint_merge_test_repro_15
    batch_size: 1
    grad_accum_steps: 16
    lr: 0.00001
    epochs: 6
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    lr_scheduler_type: "linear"
    regex_targets:
      - "visual\\.blocks\\.\\d+\\.attn\\.(qkv|proj)"
      - "visual\\.blocks\\.\\d+\\.mlp\\.(fc1|fc2)"
      - "visual\\.merger\\.mlp\\.[02]"
      - "self_attn\\.(q_proj|k_proj|v_proj|o_proj)"
      - "mlp\\.(gate_proj|up_proj|down_proj)"



                          

                          