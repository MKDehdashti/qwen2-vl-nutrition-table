experiment: exp9_debug

model_id: "Qwen/Qwen2-VL-7B-Instruct"

min_pixels: 50176
max_pixels: 705600
max_seq_length: 512
warmup_ratio: 0.03

eval_strategy: "steps"
eval_steps: 2
save_strategy: "steps"
save_steps: 2
logging_steps: 1

load_best_model_at_end: true

stages:
  # Stage 1: vision warmup (last blocks only, const LR)
  - name: exp9_debug_vision_warmup
    batch_size: 1
    grad_accum_steps: 2
    lr: 0.00005
    epochs: 1
    lora_r: 1
    lora_alpha: 1
    lora_dropout: 0.1
    lr_scheduler_type: "constant"
    regex_targets:
      - "visual\\.blocks\\.(1[0-9]|2[0-3])\\.attn\\.(qkv|proj)"

  # Stage 2: full vision encoder (const LR)
  - name: exp9_debug_vision_full
    batch_size: 1
    grad_accum_steps: 2
    lr: 0.0001
    epochs: 1
    lora_r: 1
    lora_alpha: 1
    lora_dropout: 0.1
    lr_scheduler_type: "constant"
    regex_targets:
      - "visual\\.blocks\\.\\d+\\.attn\\.(qkv|proj)"
      - "visual\\.blocks\\.\\d+\\.mlp\\.(fc1|fc2)"
      - "visual\\.merger\\.mlp\\.[02]"

  # Stage 3: joint training (linear LR decay)
  - name: exp9_debug_joint_training
    batch_size: 1
    grad_accum_steps: 2
    lr: 0.00001
    epochs: 1
    lora_r: 1
    lora_alpha: 1
    lora_dropout: 0.1
    lr_scheduler_type: "linear"
    regex_targets:
      - "visual\\.blocks\\.\\d+\\.attn\\.(qkv|proj)"
      - "visual\\.blocks\\.\\d+\\.mlp\\.(fc1|fc2)"
      - "visual\\.merger\\.mlp\\.[02]"
      - "self_attn\\.(q_proj|k_proj|v_proj|o_proj)"
      - "mlp\\.(gate_proj|up_proj|down_proj)"

debug:
  dataset_subset: 20
  wandb_suffix: "-debug"
  wandb_tags: ["debug"]
  max_steps: 10
  max_seq_length: 256
