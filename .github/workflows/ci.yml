name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The metric and prompt modules are deliberately dependency-free, so the
      # suite that guards correctness runs without torch, transformers or vLLM.
      # Tests that need the heavy stack skip themselves.
      - name: Install test dependencies
        # Pinned so a future pytest major release cannot turn this red on its
        # own. Verified against both 8.3.5 and 9.1.1.
        run: python -m pip install --upgrade pip && python -m pip install 'pytest>=8,<10'

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Byte-compile all source
        run: |
          python -m compileall -q \
            nutrition_table_fine_tuning/src \
            nutrition_table_inference/src

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # ruff is pre-1.0 and changes rule behaviour between minor releases,
        # so pin it exactly.
        run: python -m pip install --upgrade pip && python -m pip install 'ruff==0.16.3'
      - name: Lint
        run: ruff check .   # rules and excludes come from pyproject.toml
